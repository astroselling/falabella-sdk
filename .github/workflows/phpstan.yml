name: PHPStan

on:
  pull_request:
    branches: [ main ]

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v2
        env:
          # github.token siempre existe; el secret COMPOSER_GITHUB_TOKEN no está definido
          # en este repo y un token vacío hace fallar la autenticación de composer.
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github
